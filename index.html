
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>7SANS – an Emotion</title>

<style>
:root {
  --red: #a91f24;
  --gold: #c99743;
  --cream: #fffaf2;
  --dark: #302522;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fffaf2, #f8ead8);
}

.card {
  width: 100%;
  max-width: 430px;
  text-align: center;
  padding: 35px 25px;
  background: #fff;
  border: 2px solid var(--gold);
  border-radius: 25px;
  box-shadow: 0 10px 35px #00000012;
}

.brand {
  font-family: Georgia, serif;
  font-size: 58px;
  font-weight: bold;
  color: var(--red);
  letter-spacing: 2px;
}

.tagline {
  color: var(--red);
  font-family: Georgia, serif;
  font-style: italic;
  margin: 5px 0 25px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 30px;
  color: var(--red);
  margin-bottom: 10px;
}

p {
  color: #76645a;
  line-height: 1.6;
  margin-bottom: 25px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.btn {
  display: block;
  padding: 16px;
  border-radius: 12px;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: var(--red);
  border: 1px solid var(--red);
  transition: 0.2s;
}

.btn:hover {
  transform: translateY(-3px);
  opacity: 0.9;
}

.google {
  background: white;
  color: var(--red);
  border-color: var(--gold);
}

.whatsapp {
  background: white;
  color: #267346;
  border-color: #7eb693;
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #9a8170;
}

</style>
</head>

<body>

<div class="card">

  <div class="brand">7SANS</div>

  <div class="tagline">…an Emotion</div>

  <h1>Homemade with Love</h1>

  <p>
    Discover our world of delicious treats.<br>
    Connect with us!
  </p>

  <div class="buttons">

    <a class="btn"
       href="https://www.instagram.com/7sans_an_emotion/"
       target="_blank">
       ◎ Follow us on Instagram
    </a>

    <a class="btn google"
       href="https://www.google.com/search?q=7sans+the+cake+boutique"
       target="_blank">
       ★ Find us on Google
    </a>

    <a class="btn whatsapp"
       href="http://wa.me/9187057707"
       target="_blank">
       ☎ Chat with us on WhatsApp
    </a>

  </div>

  <div class="footer">
    Made with ♥ by 7SANS – an Emotion
  </div>

</div>

</body>
</html>
